name: Claude CI Fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: read

jobs:
  claude-fix:
    # Only run on PR comments (not plain issue comments) containing @claude
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get PR HEAD SHA
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.sha }}

      - name: Fetch failed CI logs
        id: ci-logs
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.pr-info.outputs.sha }}';

            // Find the latest build-apk run for this SHA
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-apk.yml',
              head_sha: sha,
              per_page: 1,
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setOutput('logs', 'No CI runs found for this commit.');
              return;
            }

            const run = runs.data.workflow_runs[0];

            // Get all jobs; collect logs only from failed ones
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });

            let allLogs = `CI run: ${run.html_url}\nOverall status: ${run.conclusion}\n\n`;

            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                try {
                  const resp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id,
                  });
                  // Keep the tail — errors appear at the bottom of logs
                  const text = resp.data.length > 40000
                    ? '...(truncated)\n' + resp.data.slice(-40000)
                    : resp.data;
                  allLogs += `\n=== FAILED JOB: ${job.name} ===\n${text}\n`;
                } catch {
                  allLogs += `\n=== FAILED JOB: ${job.name} (logs unavailable) ===\n`;
                }
              }
            }

            core.setOutput('logs', allLogs);

      - name: Run Claude fix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 5"
          prompt: |
            A developer has asked you to fix a CI failure on this pull request.

            Developer's request: "${{ github.event.comment.body }}"

            --- CI Failure Logs ---
            ${{ steps.ci-logs.outputs.logs }}
            --- End Logs ---

            Please:
            1. Read the logs above and identify the root cause of the failure
            2. Read the relevant source files to understand the context
            3. Implement the minimal fix needed to make the build/tests pass
            4. Do NOT change unrelated code
            5. Post a brief summary of what you changed and why
