name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.3
        working-directory: android-photo-cleanup

      - name: Set up debug keystore
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restoring keystore from secret..."
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "No keystore secret found — generating..."
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore generated ($(wc -c < ~/.android/debug.keystore) bytes)"
            KEYSTORE_NEW=$(base64 -w 0 ~/.android/debug.keystore)
            echo "Base64 length: ${#KEYSTORE_NEW}"
            gh secret set DEBUG_KEYSTORE_BASE64 \
              --repo "$GITHUB_REPOSITORY" \
              --body "$KEYSTORE_NEW"
            echo "Secret saved."
          fi
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-photo-cleanup

      - name: Run JVM unit tests
        run: ./gradlew test --no-daemon
        working-directory: android-photo-cleanup

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-photo-cleanup/app/build/reports/tests/
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-photo-cleanup/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  instrumentation-tests:
    runs-on: ubuntu-latest
    # Run in parallel with the build job; both need the full checkout.
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.3
        working-directory: android-photo-cleanup

      - name: Set up debug keystore
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: Nexus 6
          # Build the test APK first, then run connected tests.
          script: >
            cd android-photo-cleanup &&
            ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-results
          path: android-photo-cleanup/app/build/reports/androidTests/connected/
          retention-days: 7
