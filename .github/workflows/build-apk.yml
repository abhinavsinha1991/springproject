name: Build Android APK

on:
  push:
    branches: [ main, develop, claude/android-greeting-image-cleanup-bwu6R ]
    paths-ignore:
      - 'ci-failure-logs.txt'
  pull_request:
    paths-ignore:
      - 'ci-failure-logs.txt'
  workflow_dispatch:

# Cancel in-flight runs for the same branch/PR when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.3
        working-directory: android-photo-cleanup

      - name: Set up debug keystore
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restoring keystore from secret..."
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "No keystore secret found — generating..."
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore generated ($(wc -c < ~/.android/debug.keystore) bytes)"
            KEYSTORE_NEW=$(base64 -w 0 ~/.android/debug.keystore)
            echo "Base64 length: ${#KEYSTORE_NEW}"
            gh secret set DEBUG_KEYSTORE_BASE64 \
              --repo "$GITHUB_REPOSITORY" \
              --body "$KEYSTORE_NEW"
            echo "Secret saved."
          fi
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --configuration-cache 2>&1 | tee /tmp/gradle-build.log
        working-directory: android-photo-cleanup

      - name: Run JVM unit tests
        run: ./gradlew test --no-daemon --configuration-cache 2>&1 | tee /tmp/gradle-test.log
        working-directory: android-photo-cleanup

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-photo-cleanup/app/build/reports/tests/
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-photo-cleanup/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Remove stale failure log on success
        if: success()
        run: |
          if git ls-files --error-unmatch ci-failure-logs.txt 2>/dev/null; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git rm ci-failure-logs.txt
            git commit -m "ci: remove failure log (build passing)"
            git push origin HEAD:${{ github.head_ref || github.ref_name }} || true
          fi

      - name: Save failure logs to repo
        if: failure()
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Branch: $BRANCH"
            echo "Commit: ${{ github.sha }}"
            echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            for f in /tmp/gradle-build.log /tmp/gradle-test.log; do
              [ -f "$f" ] && { echo "## $(basename "$f")"; tail -c 35000 "$f"; echo ""; }
            done
          } > ci-failure-logs.txt
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ci-failure-logs.txt
          git commit -m "ci: save failure logs"
          git push origin HEAD:"$BRANCH" || true

  # Instrumentation tests run only on pushes to main/develop or PRs labelled 'run-e2e'.
  # This prevents spinning up an emulator for every feature-branch push.
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 22   # budget: ~8 min setup + 6 min boot + 4 min tests + 4 min buffer
    needs: build-and-test
    permissions:
      contents: write
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'
          # Same key as build-and-test so this job reuses the warm build cache
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.3
        working-directory: android-photo-cleanup

      - name: Set up debug keystore
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        id: emulator-run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86
          profile: pixel_2
          # Headless CI options: software GPU, no audio/animation/snapshots so the
          # emulator boots reliably without physical GPU or display.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Fail fast if the emulator doesn't finish booting within 6 minutes.
          emulator-boot-timeout: 360
          # timeout --kill-after=30: send SIGTERM at 4 min, then SIGKILL 30 s later.
          # Plain `timeout` only sends SIGTERM; Gradle daemon + ADB child processes
          # can ignore it and run until the job-level timeout fires (was the 30-min hang).
          script: |
            set +e
            cd "$GITHUB_WORKSPACE/android-photo-cleanup"
            timeout --kill-after=30 240 ./gradlew connectedDebugAndroidTest --no-daemon \
              > "$GITHUB_WORKSPACE/gradle-instrumentation.log" 2>&1
            GRADLE_EXIT=$?
            cat "$GITHUB_WORKSPACE/gradle-instrumentation.log"
            mkdir -p "$GITHUB_WORKSPACE/screenshots"
            adb pull \
              /sdcard/Android/data/com.photocleanup/files/test-screenshots/ \
              "$GITHUB_WORKSPACE/screenshots/" || echo "No screenshots found on device"
            exit $GRADLE_EXIT

      - name: Collect emulator step logs
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-instrumentation.log"
          if [ ! -f "$LOG" ]; then
            {
              echo "Emulator step failed before script executed (emulator may not have booted)."
              echo ""
              echo "=== adb devices ==="
              adb devices 2>&1 || true
              echo ""
              echo "=== AVD / emulator logs (~/.android) ==="
              find "$HOME/.android" -name "*.log" 2>/dev/null | sort | while IFS= read -r f; do
                echo "--- $f ---"
                tail -n 200 "$f" 2>/dev/null
                echo ""
              done
              echo "=== /tmp emulator artefacts ==="
              find /tmp -maxdepth 2 \( -name "emulator*" -o -name "android-emulator*" \) 2>/dev/null \
                | head -10 | while IFS= read -r f; do
                  [ -f "$f" ] && { echo "--- $f ---"; tail -n 100 "$f" 2>/dev/null; echo ""; }
                done
            } > "$LOG"
          fi
          if [ "${{ steps.emulator-run.outcome }}" = "failure" ]; then
            exit 1
          fi

      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-results
          path: android-photo-cleanup/app/build/reports/androidTests/connected/
          retention-days: 7

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: screenshots/
          retention-days: 7

      - name: Remove stale failure log on success
        if: success()
        run: |
          if git ls-files --error-unmatch ci-failure-logs.txt 2>/dev/null; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git rm ci-failure-logs.txt
            git commit -m "ci: remove failure log (instrumentation passing)"
            git push origin HEAD:${{ github.head_ref || github.ref_name }} || true
          fi

      - name: Save failure logs to repo
        if: failure()
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Branch: $BRANCH"
            echo "Commit: ${{ github.sha }}"
            echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            f="$GITHUB_WORKSPACE/gradle-instrumentation.log"
            [ -f "$f" ] && { echo "## gradle-instrumentation.log"; tail -c 35000 "$f"; echo ""; }
          } > ci-failure-logs.txt
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ci-failure-logs.txt
          git commit -m "ci: save instrumentation failure logs"
          git push origin HEAD:"$BRANCH" || true
