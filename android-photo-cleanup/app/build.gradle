plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

// Auto-increment versionCode on every build
def versionPropsFile = file("${rootDir}/version.properties")
def versionProps = new Properties()
versionPropsFile.withReader { versionProps.load(it) }
def buildVersionCode = versionProps['VERSION_CODE'].toInteger() + 1
versionProps['VERSION_CODE'] = buildVersionCode.toString()
versionPropsFile.withWriter { versionProps.store(it, null) }

android {
    namespace 'com.photocleanup'
    compileSdk 34

    defaultConfig {
        applicationId "com.photocleanup"
        minSdk 26
        targetSdk 34
        versionCode buildVersionCode
        versionName versionProps['VERSION_NAME']

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments['timeout_msec'] = '300000'  // 5 min for full suite
    }

    testOptions {
        animationsDisabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Print debug keystore SHA-1 at the start of every build
tasks.register('printDebugSha1') {
    doLast {
        def keystore = new File("${System.getProperty('user.home')}/.android/debug.keystore")
        if (!keystore.exists()) {
            println "\n=========================================="
            println " Debug SHA-1: keystore not found (${keystore.path})"
            println "==========================================\n"
            return
        }
        def proc = ['keytool', '-list', '-v',
            '-keystore', keystore.path,
            '-alias', 'androiddebugkey',
            '-storepass', 'android',
            '-keypass', 'android'].execute()
        def stdout = proc.text
        proc.waitFor()
        def sha1 = stdout.readLines().find { it.trim().startsWith('SHA1:') }?.trim()
        println "\n=========================================="
        println " Debug keystore ${sha1 ?: 'SHA1 not found'}"
        println "==========================================\n"
    }
}
preBuild.dependsOn printDebugSha1

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Compose
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // WorkManager for background cleanup
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Paging
    implementation 'androidx.paging:paging-runtime-ktx:3.2.1'
    implementation 'androidx.paging:paging-compose:3.2.1'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'io.mockk:mockk:1.13.8'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'com.google.android.gms:play-services-auth:20.7.0'
}
